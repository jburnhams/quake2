name: Demo paks
description: Restores or fetches the Quake 2 demo pak0.pak into .paks (see scripts/fetch-paks.sh).
outputs:
  pak:
    description: Absolute path of pak0.pak
    value: ${{ steps.fetch.outputs.pak }}
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: .paks
        key: demo-paks-${{ hashFiles('scripts/demo-paks.sha256') }}
    - id: fetch
      shell: sh
      run: echo "pak=$(scripts/fetch-paks.sh)" >> "$GITHUB_OUTPUT"
