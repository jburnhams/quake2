name: id source
description: Restores or fetches id Software's original source into .id-source (see scripts/fetch-id-source.sh).
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: .id-source
        key: id-source-${{ hashFiles('scripts/id-source.pins') }}
    - shell: sh
      run: scripts/fetch-id-source.sh
