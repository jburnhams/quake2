name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration:
    name: Integration Tests (Node 26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quake2ts
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: quake2ts/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: quake2ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace
        run: pnpm run build

      - name: Validate Dependencies
        run: pnpm exec tsx packages/tools/src/validate-deps.ts

      # Run integration tests across the workspace (excluding browser tests)
      - name: Run Full Test Suite
        run: pnpm run test:integration

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: quake2ts/packages/*/test-results/
          retention-days: 7
