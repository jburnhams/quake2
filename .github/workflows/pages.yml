name: Deploy to GitHub Pages

# The site is the explorer app (quake2ts/apps/explorer): an intro at /quake2/, the explorer at
# /quake2/explore. It carries the original Quake 2 demo archive, which the browser unpacks;
# see apps/explorer/scripts/build-site.sh for why.

on:
  push:
    branches: [ main ]
    paths:
      - 'quake2ts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quake2ts
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: quake2ts/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: quake2ts/pnpm-lock.yaml

      # id's C source, which the labs quote (quake2ts/scripts/fetch-id-source.sh).
      - name: id source
        uses: ./.github/actions/id-source

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages the game page imports
        run: pnpm run build

      - name: Typecheck and test the explorer
        run: |
          pnpm --filter @quake2ts/explorer typecheck
          pnpm --filter @quake2ts/explorer test

      - name: Fetch the demo archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download demo-paks --repo "$GITHUB_REPOSITORY" --pattern q2-314-demo-x86.exe --dir "$RUNNER_TEMP" --clobber

      - name: Build the site
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: apps/explorer/scripts/build-site.sh "$RUNNER_TEMP/q2-314-demo-x86.exe"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: quake2ts/apps/explorer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
