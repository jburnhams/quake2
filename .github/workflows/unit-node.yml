name: Unit Tests (Node)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests-node:
    name: Unit Tests (Node ${{ matrix.node-version }} - ${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26]
        group: [game, engine-client, other]
        include:
          - group: game
            packages: "packages/game"
          - group: engine-client
            packages: "packages/engine packages/client packages/cgame"
          - group: other
            packages: "--exclude packages/game --exclude packages/engine --exclude packages/client --exclude packages/cgame"
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The real-demo test (engine tests/unit-node/demo/real_demo.test.ts) reads demos/q2demo1.dm2 from the demo pak0.pak
      - name: Demo paks
        if: matrix.group == 'engine-client'
        uses: ./.github/actions/demo-paks
      - name: Run Node unit tests
        run: pnpm test:unit:node ${{ matrix.packages }}
