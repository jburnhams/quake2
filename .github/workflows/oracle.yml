name: C Oracle (differential tests)

# Runs the TS collision and player movement against id Software's cmodel.c and the
# rerelease's p_move.cpp, the message code and ref_gl's model loader (see oracle) on the same random
# inputs, and plays demo1 through id's own client beside the TS client (oracle/demo). Any difference fails the build. The job name is kept for branch protection.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  oracle:
    name: Collision vs cmodel.c
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The demo lockstep oracle builds id's whole client and ref_gl, which draws through OSMesa.
      - name: OSMesa
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6-dev
      # id's C source, which the oracles build and the labs quote (scripts/fetch-id-source.sh).
      - name: id source
        uses: ./.github/actions/id-source
      # The loader oracle reads every map, model and sprite in the demo pak0.pak.
      - name: Demo paks
        uses: ./.github/actions/demo-paks
      - name: Run differential tests
        run: pnpm test:oracle
