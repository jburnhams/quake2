name: C Oracle (differential tests)

# Runs the TS collision code against id Software's original cmodel.c on the
# same random inputs. Any difference fails the build.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  oracle:
    name: Collision vs cmodel.c
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quake2ts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: 'pnpm'
          cache-dependency-path: quake2ts/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run differential tests
        run: pnpm test:oracle
