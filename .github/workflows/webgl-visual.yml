name: WebGL Visual Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  visual-tests:
    name: WebGL Visual Tests (Node 26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # demo1 render gate (packages/engine/tests/demo1) needs the demo pak0.pak
      - name: Demo paks
        uses: ./.github/actions/demo-paks

      - name: Build workspace
        run: pnpm run build

      - name: Run WebGL Visual Tests
        env:
          ALWAYS_SAVE_SNAPSHOTS: '1'
        run: pnpm run test:webgl

      - name: Generate Visual Report
        run: npx tsx packages/tools/src/generate-webgl-report.ts

      - name: Upload Visual Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webgl-visual-test-results
          path: |
            webgl-visual-tests.json
            packages/engine/tests/webgl/__snapshots__
            packages/engine/tests/demo1/__snapshots__
