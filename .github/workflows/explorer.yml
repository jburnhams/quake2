name: Explorer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  explorer:
    name: Explorer (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      # id's C source, which the oracles build and the labs quote (scripts/fetch-id-source.sh).
      - name: id source
        uses: ./.github/actions/id-source
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the packages /play imports (engine, server; their types come from dist)
        run: pnpm run build
      - name: Typecheck
        run: pnpm --filter @quake2ts/explorer typecheck
      - name: Unit tests
        run: pnpm --filter @quake2ts/explorer test
      - name: Theme palette (current, and every pair at its contrast)
        run: pnpm --filter @quake2ts/theme test
      - name: Build
        run: pnpm --filter @quake2ts/explorer exec vite build
