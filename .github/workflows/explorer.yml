name: Explorer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  explorer:
    name: Explorer (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quake2ts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: quake2ts/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: quake2ts/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @quake2ts/explorer typecheck
      - name: Unit tests
        run: pnpm --filter @quake2ts/explorer test
      - name: Build
        run: pnpm --filter @quake2ts/explorer exec vite build
