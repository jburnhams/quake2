# Dependabot version updates: every ecosystem this repo uses, daily, as many PRs as it takes.
# Written by github-dependabot (dotfiles). Minor and patch updates ride together; a major bump is its own PR.
# No ignore rules: fix a breaking bump or record the pin as a decision in the repo, do not hide it.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/pages"
      - "/quake2ts"
      - "/quake2ts/build-config"
      - "/quake2ts/packages/bsp-tools"
      - "/quake2ts/packages/cgame"
      - "/quake2ts/packages/client"
      - "/quake2ts/packages/e2e-tests"
      - "/quake2ts/packages/engine"
      - "/quake2ts/packages/game"
      - "/quake2ts/packages/server"
      - "/quake2ts/packages/shared"
      - "/quake2ts/packages/test-utils"
      - "/quake2ts/packages/test-utils-browser"
      - "/quake2ts/packages/test-utils-dom"
      - "/quake2ts/packages/test-utils-webgl"
      - "/quake2ts/packages/test-utils-webgpu"
      - "/quake2ts/packages/tools"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
